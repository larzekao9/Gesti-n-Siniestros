# Override para desarrollo local: hot reload via bind mounts.
# Docker Compose aplica este archivo automáticamente sobre docker-compose.yml.
# No usar en staging ni producción.

services:
  # ─── S3 local para desarrollo (LocalStack) ──────────────────────────────
  localstack:
    image: localstack/localstack:4
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - PERSISTENCE=0
      - LS_LOG=warn
    volumes:
      - localstack_data:/var/lib/localstack
    networks:
      - siniestros-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      target: runner
    volumes:
      # Monta código para hot reload; paquetes ya instalados en la imagen runner
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=development
      # Mismo motivo que en frontend: bind mount Windows->Linux no propaga
      # eventos inotify. Uvicorn usa watchfiles (rust) que soporta polling
      # via esta variable. Sin esto, --reload no detecta cambios en .py.
      - WATCHFILES_FORCE_POLLING=true
      # S3 / LocalStack overrides:
      # - INTERNAL endpoint (server-side ops) → hostname resolvible en la red docker
      # - PUBLIC endpoint (firma de presigned URLs) → hostname accesible desde el browser del usuario
      - AWS_S3_ENDPOINT=http://localstack:4566
      # PUBLIC endpoint = host al que llega quien sube/descarga (browser web o
      # app móvil). Para probar la app móvil en un teléfono real, exportá la IP
      # LAN de tu PC antes de `docker compose up`:
      #   PowerShell:  $env:S3_PUBLIC_ENDPOINT = "http://192.168.100.11:4566"
      # Default localhost sirve para el panel web en la misma PC.
      - AWS_S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
    depends_on:
      localstack:
        condition: service_healthy

  celery-worker:
    build:
      target: runner
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development

  frontend:
    build:
      # deps stage: solo node_modules, sin next build (lo corre next dev en runtime)
      target: deps
    volumes:
      - ./frontend:/app
      # Preserva node_modules del contenedor (no sobreescribir con el host)
      - /app/node_modules
      - /app/.next
    command: npm run dev
    environment:
      - NODE_ENV=development
      # Fix hot-reload en Docker Desktop sobre Windows: el bind mount no
      # propaga eventos inotify desde NTFS, asi que Webpack nunca se entera
      # de los cambios. WATCHPACK_POLLING=true fuerza a Webpack a revisar
      # los archivos periodicamente (~1s). CHOKIDAR_USEPOLLING cubre otros
      # watchers (TypeScript, dotenv, etc.).
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true

volumes:
  localstack_data:
    driver: local
